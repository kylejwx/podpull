name: Update Sermon RSS Feed

on:
  # Run weekly on Sunday at 2 AM UTC
  schedule:
    - cron: '0 2 * * 0'

  # Allow manual trigger with option to scrape all pages
  workflow_dispatch:
    inputs:
      scrape_all_pages:
        description: 'Scrape all listing pages (use for initial population)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape sermons and generate feed
        run: npm start
        env:
          SCRAPE_ALL_PAGES: ${{ github.event.inputs.scrape_all_pages || 'false' }}

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sermons.json feed.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update RSS feed - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
